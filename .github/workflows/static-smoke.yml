name: Static app smoke

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download AEC federal source fixtures
        run: |
          mkdir -p tmp/aec_ci
          curl --fail --location --retry 3 https://results.aec.gov.au/31496/Website/Downloads/HouseDopByDivisionDownload-31496.csv --output tmp/aec_ci/HouseDopByDivisionDownload-31496.csv
          curl --fail --location --retry 3 https://results.aec.gov.au/27966/Website/Downloads/HouseDopByDivisionDownload-27966.csv --output tmp/aec_ci/HouseDopByDivisionDownload-27966.csv
          curl --fail --location --retry 3 https://results.aec.gov.au/24310/Website/Downloads/HouseDopByDivisionDownload-24310.csv --output tmp/aec_ci/HouseDopByDivisionDownload-24310.csv
          curl --fail --location --retry 3 https://results.aec.gov.au/20499/Website/Downloads/HouseDopByDivisionDownload-20499.csv --output tmp/aec_ci/HouseDopByDivisionDownload-20499.csv
          curl --fail --location --retry 3 https://results.aec.gov.au/17496/Website/Downloads/HouseDopByDivisionDownload-17496.csv --output tmp/aec_ci/HouseDopByDivisionDownload-17496.csv
          curl --fail --location --retry 3 https://results.aec.gov.au/15508/Website/Downloads/HouseDopByDivisionDownload-15508.csv --output tmp/aec_ci/HouseDopByDivisionDownload-15508.csv
          curl --fail --location --retry 3 https://results.aec.gov.au/13745/Website/Downloads/HouseDopByDivisionDownload-13745.csv --output tmp/aec_ci/HouseDopByDivisionDownload-13745.csv

      - name: Validate state and federal CSVs
        run: |
          python scripts/validate_vec_csv.py data/vic_2022_preferences_long.csv
          python scripts/validate_vec_csv.py data/vic_2018_preferences_long.csv
          python scripts/validate_vec_csv.py data/vic_2014_preferences_long.csv
          python scripts/validate_vec_csv.py data/vic_2010_preferences_long.csv
          python scripts/validate_vec_csv.py data/vic_2006_preferences_long.csv
          python scripts/validate_vec_csv.py data/federal_2025_au_preferences_long.csv
          python scripts/validate_vec_csv.py data/federal_2022_au_preferences_long.csv
          python scripts/validate_vec_csv.py data/federal_2019_au_preferences_long.csv
          python scripts/validate_vec_csv.py data/federal_2016_au_preferences_long.csv
          python scripts/validate_vec_csv.py data/federal_2013_vic_preferences_long.csv
          python scripts/validate_vec_csv.py data/federal_2010_vic_preferences_long.csv
          python scripts/validate_vec_csv.py data/federal_2007_vic_preferences_long.csv
          python scripts/validate_federal.py --csv data/federal_2025_au_preferences_long.csv --boundaries data/federal_2025_au_division_boundaries.geojson --aec-dop tmp/aec_ci/HouseDopByDivisionDownload-31496.csv --expected-divisions 150 --scope au
          python scripts/validate_federal.py --csv data/federal_2022_au_preferences_long.csv --boundaries data/federal_2022_au_division_boundaries.geojson --aec-dop tmp/aec_ci/HouseDopByDivisionDownload-27966.csv --expected-divisions 151 --scope au
          python scripts/validate_federal.py --csv data/federal_2019_au_preferences_long.csv --boundaries data/federal_2019_au_division_boundaries.geojson --aec-dop tmp/aec_ci/HouseDopByDivisionDownload-24310.csv --expected-divisions 151 --scope au
          python scripts/validate_federal.py --csv data/federal_2016_au_preferences_long.csv --boundaries data/federal_2016_au_division_boundaries.geojson --aec-dop tmp/aec_ci/HouseDopByDivisionDownload-20499.csv --expected-divisions 150 --scope au
          python scripts/validate_federal.py --csv data/federal_2013_vic_preferences_long.csv --boundaries data/federal_2013_vic_division_boundaries.geojson --aec-dop tmp/aec_ci/HouseDopByDivisionDownload-17496.csv --expected-divisions 37 --scope vic
          python scripts/validate_federal.py --csv data/federal_2010_vic_preferences_long.csv --boundaries data/federal_2010_vic_division_boundaries.geojson --aec-dop tmp/aec_ci/HouseDopByDivisionDownload-15508.csv --expected-divisions 37 --scope vic
          python scripts/validate_federal.py --csv data/federal_2007_vic_preferences_long.csv --boundaries data/federal_2010_vic_division_boundaries.geojson --aec-dop tmp/aec_ci/HouseDopByDivisionDownload-13745.csv --expected-divisions 37 --scope vic
          python scripts/validate_state_vic.py --csv data/vic_2010_preferences_long.csv --boundaries data/vic_2010_district_boundaries.geojson --expected-districts 88
          python scripts/validate_state_vic.py --csv data/vic_2006_preferences_long.csv --boundaries data/vic_2006_district_boundaries.geojson --expected-districts 88
          python scripts/validate_state_vic.py --csv data/sa_2022_preferences_long.csv --boundaries data/sa_2022_district_boundaries.geojson --expected-districts 47 --label SA-2022 --max-gap-ratio 0.005 --validate-vote-totals
          python scripts/validate_state_vic.py --csv data/sa_2018_preferences_long.csv --boundaries data/sa_2018_district_boundaries.geojson --expected-districts 47 --label SA-2018 --max-gap-ratio 0.005 --validate-vote-totals
          python scripts/validate_state_vic.py --csv data/wa_2025_preferences_long.csv --boundaries data/wa_2025_district_boundaries.geojson --expected-districts 59 --label WA-2025 --max-gap-ratio 0.005 --validate-vote-totals
          python scripts/validate_state_vic.py --csv data/wa_2021_preferences_long.csv --boundaries data/wa_2021_district_boundaries.geojson --expected-districts 59 --label WA-2021 --max-gap-ratio 0.005 --validate-vote-totals
          python scripts/validate_state_vic.py --csv data/nt_2024_preferences_long.csv --boundaries data/nt_2024_district_boundaries.geojson --expected-districts 25 --label NT-2024 --max-gap-ratio 0.005 --validate-vote-totals
          python scripts/validate_state_vic.py --csv data/nt_2020_preferences_long.csv --boundaries data/nt_2020_district_boundaries.geojson --expected-districts 25 --label NT-2020 --max-gap-ratio 0.005 --validate-vote-totals
          python scripts/validate_tas_state.py --csv data/tas_2025_preferences_long.csv --boundaries data/tas_2025_district_boundaries.geojson
          python scripts/validate_tas_state.py --csv data/tas_2024_preferences_long.csv --boundaries data/tas_2024_district_boundaries.geojson
          python scripts/validate_tas_state.py --csv data/tas_2021_preferences_long.csv --boundaries data/tas_2021_district_boundaries.geojson --expected-members 5
          python scripts/validate_nz_2023.py
          python scripts/validate_nz_2023.py --year 2020
          python scripts/validate_uk_federal.py --year 2024
          python scripts/validate_uk_federal.py --year 2019
          python scripts/validate_uk_federal.py --year 2017
          python scripts/validate_malaysia_federal.py --year 2022
          python scripts/validate_malaysia_federal.py --year 2018
          python scripts/validate_malaysia_federal.py --year 2013
          python scripts/validate_singapore_federal.py --year 2025
          python scripts/validate_singapore_federal.py --year 2020
          python scripts/validate_singapore_federal.py --year 2015
          python scripts/validate_canada_federal.py --year 2025
          python scripts/validate_canada_federal.py --year 2021
          python scripts/validate_india_federal.py
          python scripts/validate_japan_house.py --year 2026
          python scripts/validate_japan_house.py --year 2024
          python scripts/validate_thailand_2026.py
          python scripts/validate_philippines_2022.py
          python scripts/validate_mexico_2024.py
          python scripts/validate_south_korea_presidential.py
          python scripts/validate_us_house.py
          python scripts/validate_indonesia_presidential.py
          python scripts/validate_indonesia_historical_presidential.py

      - name: Smoke test static app
        run: |
          python scripts/check_repository_sizes.py
          python scripts/smoke_static_app.py
