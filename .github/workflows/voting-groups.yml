name: Voting groups and NYC elections

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  voting-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install numerical validation dependencies
        run: pip install numpy==2.0.2 scipy==1.13.1 scikit-learn==1.6.1 'shapely>=2.0.0'
      - name: Verify certified NYC returns and map joins
        run: |
          python scripts/validate_nyc_mayor_2025.py
          python scripts/validate_nyc_mayor_history.py
      - name: Verify state and county voting models
        run: |
          python scripts/test_us_state_clusters.py
          python scripts/test_us_county_clusters.py
          node scripts/test_voting_methods.cjs
      - name: Verify population and demographics
        run: |
          node scripts/test_population_dots.cjs
          node scripts/test_county_scatter_demographics.cjs
      - name: Reconcile estimated NYC histories and vote ledgers
        run: |
          python scripts/test_nyc_reference_map_comparison.py
          python scripts/test_nyc_history_clusters.py

  voting-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite:
          - test_state_clusters_ux
          - test_county_clusters_ux
          - test_county_dots_ux
          - test_county_dots_map_ux
          - test_political_bands_ux
          - test_population_dots_ux
          - test_county_demographic_scatter_ux
          - test_nyc_mayor_2025_ux
          - test_nyc_precinct_dots
          - test_nyc_history_dots_ux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          pip install playwright==1.60.0
          python -m playwright install --with-deps chromium
      - name: Check interactions and responsive layouts
        run: python scripts/${{ matrix.suite }}.py
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suite }}-screenshots
          path: tmp/**/*.png
          if-no-files-found: ignore
